name: Deploy Vite to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      # The simulator's lock state can live in a private repository; the
      # trainers' page saves there and starts this workflow.
      - name: Fetch lock state
        run: node scripts/fetch-lock-state.mjs
        env:
          KILIT_TOKEN: ${{ secrets.KILIT_TOKEN }}

      # The Arduino Library Manager's list of libraries, for the simulator's
      # compiler; if it cannot be fetched, the browser fetches it itself.
      - name: Build library index
        run: node scripts/build-library-index.mjs
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          # Address of the Arduino compile server (compile-server/README.md).
          VITE_ARDUINO_COMPILE_URL: ${{ vars.ARDUINO_COMPILE_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
